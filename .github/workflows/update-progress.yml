name: Update project progress

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/PIPELINE.md
      - docs/project_status.json
      - docs/assets/project-progress.svg
      - docs/assets/fonts/**
      - scripts/check_progress.py
      - scripts/generate_progress_svg.py
      - scripts/update_progress_dashboard.py
      - .github/workflows/update-progress.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-progress:
    name: Validate, regenerate, and commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[progress-auto]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'

      - name: Validate progress sources
        run: python scripts/check_progress.py --source-only

      - name: Regenerate README dashboard
        run: python scripts/update_progress_dashboard.py

      - name: Regenerate progress SVG
        run: python scripts/generate_progress_svg.py

      - name: Validate generated files
        run: python scripts/check_progress.py

      - name: Commit generated updates
        shell: bash
        run: |
          if git diff --quiet -- README.md docs/assets/project-progress.svg; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md docs/assets/project-progress.svg
          git commit -m "Update project progress dashboard [progress-auto]"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
